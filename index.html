<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Pixie Dodge：拖動小精靈閃避四面八方彈幕的像素風生存遊戲。">
<title>Pixie Dodge</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; height: 100dvh;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block; touch-action: none; cursor: grab;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  body.dragging canvas { cursor: grabbing; }
  noscript { color: #fff; font-family: sans-serif; padding: 16px; }
</style>
</head>
<body>
<canvas id="game" width="180" height="320" aria-label="Pixie Dodge 遊戲畫面"></canvas>
<noscript>這個遊戲需要啟用 JavaScript。</noscript>
<script>
'use strict';
(() => {
  // ---------- 基本設定 ----------
  const W = 180, H = 320;          // 邏輯解析度（直式）
  const HIT_R = 1.5;               // 小精靈判定半徑
  const PICK_R = 11;               // 道具拾取距離（用外觀大小）
  const VOL = 0.22;
  const DEBUG = location.hash === '#debug';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // 16 色調色盤
  const PAL = ['#000000', '#1d2b53', '#7e2553', '#008751', '#ab5236', '#5f574f', '#c2c3c7', '#fff1e8',
               '#ff004d', '#ffa300', '#ffec27', '#00e436', '#29adff', '#83769c', '#ff77a8', '#ffccaa'];

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 無法儲存時忽略 */ } },
  };

  // ---------- 像素圖 ----------
  function makeSprite(rows) {
    const h = rows.length, w = rows[0].length;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.') continue;
      g.fillStyle = PAL[parseInt(ch, 16)];
      g.fillRect(x, y, 1, 1);
    }
    return c;
  }
  function circleSprite(d, outer, inner) {
    const c = document.createElement('canvas');
    c.width = c.height = d;
    const g = c.getContext('2d');
    const m = (d - 1) / 2, R = (d / 2) ** 2 - 0.3, r = (d / 2 - 1) ** 2;
    for (let y = 0; y < d; y++) for (let x = 0; x < d; x++) {
      const q = (x - m) ** 2 + (y - m) ** 2;
      if (q > R) continue;
      g.fillStyle = PAL[q <= r ? inner : outer];
      g.fillRect(x, y, 1, 1);
    }
    return c;
  }
  function ringSprite(d, color, thick) {
    const c = document.createElement('canvas');
    c.width = c.height = d;
    const g = c.getContext('2d');
    const m = (d - 1) / 2, R = (d / 2) ** 2 - 0.3, r = (d / 2 - thick) ** 2;
    g.fillStyle = PAL[color];
    for (let y = 0; y < d; y++) for (let x = 0; x < d; x++) {
      const q = (x - m) ** 2 + (y - m) ** 2;
      if (q <= R && q >= r) g.fillRect(x, y, 1, 1);
    }
    return c;
  }

  const FAIRY = makeSprite([
    '....eeee....',
    '...eeeeee...',
    '...effffe...',
    '...f1ff1f...',
    '...ffffff...',
    '....ffff....',
    '....cccc....',
    '...c7cccc...',
    '...cccccc...',
    '..cccccccc..',
    '....f..f....',
    '....f..f....',
  ]);
  const WING_A = makeSprite([
    '............',
    '.cc......cc.',
    'c77c....c77c',
    'c77c....c77c',
    '.c7c....c7c.',
    '..cc....cc..',
    '...c....c...',
    '............',
    '............',
    '............',
    '............',
    '............',
  ]);
  const WING_B = makeSprite([
    '............',
    '............',
    '............',
    '............',
    '............',
    '...c....c...',
    '..cc....cc..',
    'c77c....c77c',
    'c77c....c77c',
    '.cc......cc.',
    '............',
    '............',
  ]);
  const HEART_ROWS = ['.88.88.', '8788888', '8888888', '.88888.', '..888..', '...8...'];
  const HEART = makeSprite(HEART_ROWS);
  const HEART_EMPTY = makeSprite(HEART_ROWS.map(r => r.replace(/[0-9a-f]/g, '5')));
  const ICON_PAUSE = makeSprite(Array(7).fill('77..77'));
  const ICON_PLAY = makeSprite(['7.....', '77....', '777...', '7777..', '777...', '77....', '7.....']);
  const ICON_SOUND = makeSprite(['...7.....', '..77..7..', '7777...7.', '7777.7.7.', '7777...7.', '..77..7..', '...7.....']);
  const ICON_MUTE = makeSprite(['...7.....', '..77.....', '7777.8.8.', '7777..8..', '7777.8.8.', '..77.....', '...7.....']);

  const ITEM_SPR = {
    shield: makeSprite(['ccccccccc', 'c7ccccccc', 'c7ccccccc', 'cccc7cccc', 'ccc777ccc', '.ccccccc.', '..ccccc..', '...ccc...', '....c....']),
    bomb: makeSprite(['.....a.a.', '......a..', '.....9...', '..5559...', '.5555555.', '556555555', '565555555', '.5555555.', '..55555..']),
    slow: makeSprite(['ccccccccc', '.caaaaac.', '..caaac..', '...cac...', '....c....', '...c.c...', '..c.a.c..', '.caaaaac.', 'ccccccccc']),
    heal: makeSprite(['.........', '.888.888.', '877888888', '878888888', '888888888', '.8888888.', '..88888..', '...888...', '....8....']),
  };
  const ITEM_TYPES = Object.keys(ITEM_SPR);
  const ITEM_RING = ringSprite(13, 7, 1.2);
  const SHIELD_RING = ringSprite(19, 12, 1.5);
  const FOCUS_RING = ringSprite(11, 7, 1);
  const EMITTER = circleSprite(7, 14, 2);

  // 子彈種類：外觀與判定半徑
  const BT = {
    aimed:  { spr: circleSprite(4, 8, 7),  r: 1.6 },
    fan:    { spr: circleSprite(4, 9, 10), r: 1.6 },
    wall:   { spr: makeSprite(['9999', '9aa9', '9aa9', '9999']), r: 1.8 },
    ring:   { spr: circleSprite(5, 11, 7), r: 2 },
    spiral: { spr: circleSprite(3, 14, 7), r: 1.2 },
    homing: { spr: circleSprite(6, 13, 7), r: 2.4 },
  };

  // ---------- 3x5 點陣字 ----------
  // 每列 3 bit：4=左、2=中、1=右
  const FONT = {
    '0': [7, 5, 5, 5, 7], '1': [2, 6, 2, 2, 7], '2': [7, 1, 7, 4, 7], '3': [7, 1, 7, 1, 7], '4': [5, 5, 7, 1, 1],
    '5': [7, 4, 7, 1, 7], '6': [7, 4, 7, 5, 7], '7': [7, 1, 1, 1, 1], '8': [7, 5, 7, 5, 7], '9': [7, 5, 7, 1, 7],
    'A': [2, 5, 7, 5, 5], 'B': [6, 5, 6, 5, 6], 'C': [3, 4, 4, 4, 3], 'D': [6, 5, 5, 5, 6], 'E': [7, 4, 6, 4, 7],
    'F': [7, 4, 6, 4, 4], 'G': [3, 4, 5, 5, 3], 'H': [5, 5, 7, 5, 5], 'I': [7, 2, 2, 2, 7], 'J': [1, 1, 1, 5, 2],
    'K': [5, 5, 6, 5, 5], 'L': [4, 4, 4, 4, 7], 'M': [5, 7, 7, 5, 5], 'N': [6, 5, 5, 5, 5], 'O': [2, 5, 5, 5, 2],
    'P': [6, 5, 6, 4, 4], 'Q': [2, 5, 5, 6, 3], 'R': [6, 5, 6, 5, 5], 'S': [3, 4, 2, 1, 6], 'T': [7, 2, 2, 2, 2],
    'U': [5, 5, 5, 5, 7], 'V': [5, 5, 5, 5, 2], 'W': [5, 5, 7, 7, 5], 'X': [5, 5, 2, 5, 5], 'Y': [5, 5, 2, 2, 2],
    'Z': [7, 1, 2, 4, 7], ' ': [0, 0, 0, 0, 0], '.': [0, 0, 0, 0, 2], ':': [0, 2, 0, 2, 0], '!': [2, 2, 2, 0, 2],
    '-': [0, 0, 7, 0, 0], '/': [1, 1, 2, 4, 4], '+': [0, 2, 7, 2, 0], '?': [6, 1, 2, 0, 2],
  };
  function rawText(str, x, y, color, s) {
    ctx.fillStyle = color;
    let cx = x;
    for (const ch of str) {
      const g = FONT[ch];
      if (g) for (let r = 0; r < 5; r++) {
        const row = g[r];
        if (row & 4) ctx.fillRect(cx, y + r * s, s, s);
        if (row & 2) ctx.fillRect(cx + s, y + r * s, s, s);
        if (row & 1) ctx.fillRect(cx + 2 * s, y + r * s, s, s);
      }
      cx += 4 * s;
    }
  }
  function drawText(str, x, y, color, s = 1) {
    str = String(str).toUpperCase();
    rawText(str, x + s, y + s, PAL[0], s);  // 陰影
    rawText(str, x, y, color, s);
  }
  const textW = (str, s = 1) => String(str).length * 4 * s - s;
  const drawTextC = (str, cx, y, color, s = 1) => drawText(str, Math.round(cx - textW(str, s) / 2), y, color, s);

  // ---------- 音效（Web Audio 合成）----------
  let actx = null, master = null, noiseBuf = null, lastShoot = 0;
  let muted = store.get('danmaku-muted') === '1';

  function ensureAudio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        actx = new AC();
        master = actx.createGain();
        master.gain.value = muted ? 0 : VOL;
        master.connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { actx = null; return; }
    }
    if (actx.state === 'suspended') actx.resume();
  }
  function tone(type, f0, f1, dur, vol, delay = 0) {
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, f0 = 2000, f1 = f0, delay = 0) {
    const t0 = actx.currentTime + delay;
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = noiseBuf;
    f.type = 'lowpass';
    f.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f).connect(g).connect(master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }
  const SFX = {
    start()  { tone('square', 440, 880, 0.12, 0.25); },
    shoot()  { tone('square', 900, 500, 0.05, 0.12); },
    hurt()   { tone('square', 300, 60, 0.3, 0.5); noise(0.25, 0.4); },
    shield() { tone('triangle', 1200, 300, 0.25, 0.5); },
    pickup() { [660, 880, 1320].forEach((f, i) => tone('square', f, f, 0.07, 0.3, i * 0.06)); },
    bomb()   { noise(0.6, 0.7, 3000, 200); tone('square', 200, 40, 0.5, 0.4); },
    level()  { [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.09, 0.25, i * 0.08)); },
    warn()   { tone('sawtooth', 880, 880, 0.08, 0.2); tone('sawtooth', 880, 880, 0.08, 0.2, 0.14); },
    laser()  { tone('sawtooth', 160, 60, 0.45, 0.3); noise(0.3, 0.2, 1500, 400); },
    over()   { [392, 330, 262, 196].forEach((f, i) => tone('triangle', f, f * 0.98, 0.22, 0.5, i * 0.18)); },
    record() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone('square', f, f, 0.1, 0.25, 0.8 + i * 0.09)); },
  };
  function sfx(name) {
    if (!actx || muted) return;
    if (name === 'shoot') {
      if (actx.currentTime - lastShoot < 0.06) return;
      lastShoot = actx.currentTime;
    }
    SFX[name]();
  }
  function toggleMute() {
    muted = !muted;
    store.set('danmaku-muted', muted ? '1' : '0');
    if (master) master.gain.value = muted ? 0 : VOL;
  }

  // ---------- 遊戲狀態 ----------
  let state = 'title', stateT = 0;
  const player = { x: W / 2, y: 250, lives: 3, inv: 0, shield: 0, slow: 0, wingT: 0, trailT: 0, lastX: W / 2, lastY: 250 };
  let elapsed = 0, bonus = 0, level = 1, unlockIdx = 1, spawnT = 1, itemT = 15;
  let patterns = [], items = [], popups = [], banner = null;
  let shakeT = 0, flashT = 0, hurtT = 0;
  let hi = parseInt(store.get('danmaku-highscore'), 10) || 0;
  let finalScore = 0, newRecord = false, god = false, fps = 60;

  const bullets = [], bulletPool = [];
  const parts = [], partPool = [];
  const stars = Array.from({ length: 60 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    sp: 4 + Math.random() * 14, c: [5, 5, 13, 13, 6, 7][Math.floor(Math.random() * 6)], ph: Math.random() * 6,
  }));
  const keys = {};
  let drag = null;

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const score = () => Math.floor(elapsed * 10) + bonus;

  // 難度曲線
  const spawnInterval = () => Math.max(0.4, 1.5 - elapsed * 1.1 / 180);
  const spdMul = () => Math.min(1.8, 1 + elapsed * 0.8 / 240);
  const maxConcurrent = () => Math.min(4, 1 + Math.floor(elapsed / 30));

  // ---------- 物件池 ----------
  function spawnBullet(x, y, ang, spd, type) {
    if (bullets.length >= 700) return null;
    const b = bulletPool.pop() || {};
    const bt = BT[type];
    b.x = x; b.y = y; b.a = ang; b.spd = spd;
    b.vx = Math.cos(ang) * spd; b.vy = Math.sin(ang) * spd;
    b.bt = bt; b.r = bt.r; b.age = 0;
    b.homing = type === 'homing';
    b.life = b.homing ? 4 : Infinity;
    bullets.push(b);
    return b;
  }
  function removeBullet(i) {
    const b = bullets[i], last = bullets.pop();
    if (i < bullets.length) bullets[i] = last;
    bulletPool.push(b);
  }
  function clearBullets() {
    while (bullets.length) bulletPool.push(bullets.pop());
  }
  function spawnPart(x, y, vx, vy, life, color) {
    if (parts.length >= 400) return;
    const p = partPool.pop() || {};
    p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.max = life; p.c = color;
    parts.push(p);
  }
  function burst(x, y, color, n, speed = 50) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random() * 0.7);
      spawnPart(x, y, Math.cos(a) * s, Math.sin(a) * s, 0.3 + Math.random() * 0.4, color);
    }
  }

  // ---------- 攻擊模式 ----------
  function edgePoint(inset) { // inset < 0 表示在畫面外
    let p = Math.random() * 2 * (W + H);
    if (p < W) return { x: p, y: inset };
    p -= W;
    if (p < H) return { x: W - inset, y: p };
    p -= H;
    if (p < W) return { x: W - p, y: H - inset };
    p -= W;
    return { x: inset, y: H - p };
  }
  function farEdgePoint(inset, minD) {
    let e;
    for (let i = 0; i < 12; i++) {
      e = edgePoint(inset);
      if (Math.hypot(e.x - player.x, e.y - player.y) >= minD) break;
    }
    return e;
  }
  const aimAt = (x, y) => Math.atan2(player.y - y, player.x - x);

  const MAKERS = {
    aimed() {
      const n = Math.min(3, 1 + Math.floor(elapsed / 10));
      const e = farEdgePoint(-4, 60);
      let shot = 0, cd = 0;
      sfx('shoot');
      return { update(dt) {
        cd -= dt;
        if (cd <= 0) { spawnBullet(e.x, e.y, aimAt(e.x, e.y), 70 * spdMul(), 'aimed'); shot++; cd = 0.12; }
        return shot >= n;
      } };
    },
    fan() {
      const e = farEdgePoint(-4, 60);
      const waves = elapsed > 70 ? 2 : 1;
      let w = 0, cd = 0;
      return { update(dt) {
        cd -= dt;
        if (cd <= 0) {
          const n = 5 + Math.floor(Math.random() * 5), base = aimAt(e.x, e.y), spread = 0.9;
          for (let i = 0; i < n; i++) spawnBullet(e.x, e.y, base - spread / 2 + spread * i / (n - 1), 55 * spdMul(), 'fan');
          sfx('shoot');
          w++; cd = 0.35;
        }
        return w >= waves;
      } };
    },
    wall() {
      const side = Math.floor(Math.random() * 4);
      const len = side % 2 === 0 ? W : H;
      const gapW = 28;
      const gapC = 20 + gapW / 2 + Math.random() * (len - 40 - gapW);
      const spd = 36 * spdMul();
      for (let s = 5; s < len; s += 10) {
        if (Math.abs(s - gapC) < gapW / 2) continue;
        if (side === 0) spawnBullet(s, -4, Math.PI / 2, spd, 'wall');
        else if (side === 1) spawnBullet(W + 4, s, Math.PI, spd, 'wall');
        else if (side === 2) spawnBullet(s, H + 4, -Math.PI / 2, spd, 'wall');
        else spawnBullet(-4, s, 0, spd, 'wall');
      }
      sfx('shoot');
      return { update() { return true; } };
    },
    ring() {
      const e = farEdgePoint(14 + Math.random() * 16, 70);
      const rings = elapsed > 120 ? 2 : 1, n = elapsed > 90 ? 18 : 14;
      let k = 0, cd = 0.6;
      return {
        update(dt) {
          cd -= dt;
          if (cd <= 0) {
            const off = k * Math.PI / n + Math.random() * 0.3;
            for (let i = 0; i < n; i++) spawnBullet(e.x, e.y, off + i * 2 * Math.PI / n, 42 * spdMul(), 'ring');
            sfx('shoot');
            k++; cd = 0.35;
          }
          return k >= rings;
        },
        draw() { if (k === 0 && Math.floor(cd * 12) % 2 === 0) ctx.drawImage(EMITTER, Math.round(e.x) - 3, Math.round(e.y) - 3); },
      };
    },
    spiral() {
      const e = farEdgePoint(16 + Math.random() * 20, 70);
      const arms = elapsed > 110 ? 3 : 2, dir = Math.random() < 0.5 ? 1 : -1;
      let el = 0, cd = 0, ang = Math.random() * Math.PI * 2;
      sfx('shoot');
      return {
        update(dt) {
          el += dt;
          ang += dir * 2.6 * dt;
          if (el > 0.4) {
            cd -= dt;
            if (cd <= 0) {
              for (let i = 0; i < arms; i++) spawnBullet(e.x, e.y, ang + i * 2 * Math.PI / arms, 48 * spdMul(), 'spiral');
              cd = 0.09;
            }
          }
          return el >= 3.4;
        },
        draw() { if (el > 0.4 || Math.floor(el * 12) % 2 === 0) ctx.drawImage(EMITTER, Math.round(e.x) - 3, Math.round(e.y) - 3); },
      };
    },
    homing() {
      const n = elapsed > 130 ? 3 : 2;
      let k = 0, cd = 0;
      return { update(dt) {
        cd -= dt;
        if (cd <= 0) {
          const e = farEdgePoint(-4, 80);
          spawnBullet(e.x, e.y, aimAt(e.x, e.y), 38 * spdMul(), 'homing');
          sfx('shoot');
          k++; cd = 0.5;
        }
        return k >= n;
      } };
    },
    laser() {
      const n = elapsed > 140 ? 2 : 1;
      const angs = [0, Math.PI / 2, Math.PI / 4, 3 * Math.PI / 4];
      const a0 = Math.floor(Math.random() * 4);
      const lines = [];
      for (let i = 0; i < n; i++) lines.push({ x: player.x, y: player.y, a: angs[(a0 + i * 2) % 4] });
      let el = 0, fired = false;
      sfx('warn');
      return {
        update(dt) {
          el += dt;
          if (el >= 1 && !fired) { fired = true; sfx('laser'); shakeT = Math.max(shakeT, 0.1); }
          if (fired && el < 1.5 && state === 'play') {
            for (const l of lines) {
              const d = Math.abs((player.x - l.x) * Math.sin(l.a) - (player.y - l.y) * Math.cos(l.a));
              if (d < 1.5 + HIT_R) { hitPlayer(); break; }
            }
          }
          return el >= 1.5;
        },
        draw() {
          for (const l of lines) {
            if (el < 1) { if (Math.floor(el * 10) % 2 === 0) pixelLine(l, 1, PAL[8], true); }
            else { pixelLine(l, 3, PAL[8], false); pixelLine(l, 1, PAL[7], false); }
          }
        },
      };
    },
  };
  const UNLOCKS = [['aimed', 0], ['fan', 15], ['wall', 30], ['ring', 45], ['spiral', 60], ['homing', 80], ['laser', 100]];

  function addPattern(kind) {
    const p = MAKERS[kind]();
    p.kind = kind;
    patterns.push(p);
  }
  function pickPattern() {
    const avail = UNLOCKS.filter(u => elapsed >= u[1]);
    addPattern(avail[Math.floor(Math.random() * avail.length)][0]);
  }

  function pixelLine(l, w, color, dash) {
    ctx.fillStyle = color;
    const c = Math.cos(l.a), s = Math.sin(l.a);
    const step = 1 / Math.max(Math.abs(c), Math.abs(s));
    const half = w >> 1;
    for (let k = -400; k <= 400; k += step) {
      if (dash && Math.floor(k / 4) % 2) continue;
      const x = Math.round(l.x + c * k), y = Math.round(l.y + s * k);
      if (x < -2 || x > W + 2 || y < -2 || y > H + 2) continue;
      ctx.fillRect(x - half, y - half, w, w);
    }
  }

  // ---------- 道具 ----------
  function spawnItem(kind, x, y) {
    if (x === undefined) {
      for (let i = 0; i < 12; i++) {
        x = 14 + Math.random() * (W - 28);
        y = 34 + Math.random() * (H - 54);
        if (Math.hypot(x - player.x, y - player.y) > 50) break;
      }
    }
    items.push({ k: kind || ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)], x, y, age: 0 });
  }
  function popup(text, color) {
    popups.push({ text, x: player.x, y: player.y - 12, age: 0, c: color });
  }
  function pickup(k) {
    sfx('pickup');
    if (k === 'shield') { player.shield = 10; popup('SHIELD', PAL[12]); }
    else if (k === 'slow') { player.slow = 5; popup('SLOW', PAL[12]); }
    else if (k === 'bomb') { bomb(); popup('BOMB!', PAL[9]); }
    else if (player.lives < 3) { player.lives++; popup('+1 LIFE', PAL[8]); }
    else { bonus += 50; popup('+50', PAL[10]); }
  }
  function bomb() {
    for (const b of bullets) {
      spawnPart(b.x, b.y, (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, 0.4, 7);
    }
    clearBullets();
    patterns = [];
    spawnT = 1.2;
    flashT = 0.25;
    sfx('bomb');
  }

  // ---------- 狀態切換 ----------
  function startGame() {
    clearBullets();
    patterns = []; items = []; popups = [];
    elapsed = 0; bonus = 0; level = 1; unlockIdx = 1;
    spawnT = 1; itemT = 12 + Math.random() * 6;
    Object.assign(player, { x: W / 2, y: 250, lives: 3, inv: 1, shield: 0, slow: 0, lastX: W / 2, lastY: 250 });
    shakeT = flashT = hurtT = 0;
    newRecord = false;
    banner = { title: 'LEVEL 1', sub: 'SURVIVE!', c: PAL[10], age: 0 };
    state = 'play'; stateT = 0;
    sfx('start');
  }
  function toTitle() {
    clearBullets();
    patterns = []; items = []; popups = [];
    state = 'title'; stateT = 0;
  }
  function releaseInput() {
    for (const k in keys) keys[k] = false;
    drag = null;
    document.body.classList.remove('dragging');
  }
  function pauseGame() {
    if (state !== 'play') return;
    state = 'pause';
    releaseInput();
  }
  function resumeGame() {
    if (state === 'pause') state = 'play';
  }
  function gameOver() {
    state = 'over'; stateT = 0;
    finalScore = score();
    newRecord = finalScore > hi;
    if (newRecord) {
      hi = finalScore;
      if (!DEBUG) store.set('danmaku-highscore', String(hi));
    }
    releaseInput();
    burst(player.x, player.y, 14, 20, 70);
    burst(player.x, player.y, 12, 20, 70);
    burst(player.x, player.y, 7, 12, 40);
    sfx('over');
    if (newRecord) sfx('record');
  }
  function hitPlayer() {
    if (player.inv > 0 || god || state !== 'play') return;
    if (player.shield > 0) {
      player.shield = 0;
      player.inv = 1;
      burst(player.x, player.y, 12, 14);
      sfx('shield');
      return;
    }
    player.lives--;
    player.inv = 1.5;
    shakeT = 0.3; hurtT = 0.2;
    burst(player.x, player.y, 8, 16);
    sfx('hurt');
    if (player.lives <= 0) gameOver();
  }
  function showBanner(title, sub, color) {
    banner = { title, sub, c: color, age: 0 };
  }

  // ---------- 更新 ----------
  function updatePlay(dt) {
    elapsed += dt;

    // 解鎖與升級提示
    let newName = null;
    while (unlockIdx < UNLOCKS.length && elapsed >= UNLOCKS[unlockIdx][1]) {
      newName = UNLOCKS[unlockIdx][0].toUpperCase();
      unlockIdx++;
    }
    const lv = Math.floor(elapsed / 15) + 1;
    if (lv > level) {
      level = lv;
      showBanner('LEVEL ' + lv, newName ? 'NEW: ' + newName : '', PAL[10]);
      sfx('level');
      newName = null;
    }
    if (newName) { showBanner('WARNING', 'NEW: ' + newName, PAL[8]); sfx('warn'); }

    if (player.inv > 0) player.inv -= dt;
    if (player.shield > 0) player.shield = Math.max(0, player.shield - dt);
    if (player.slow > 0) player.slow = Math.max(0, player.slow - dt);

    // 鍵盤移動
    const kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    const ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    if (kx || ky) {
      const len = Math.hypot(kx, ky), sp = 110 * (focusing() ? 0.4 : 1);
      player.x = clamp(player.x + kx / len * sp * dt, 4, W - 4);
      player.y = clamp(player.y + ky / len * sp * dt, 4, H - 4);
    }

    // 小精靈翅膀與閃光拖尾
    player.wingT += dt;
    const moved = Math.hypot(player.x - player.lastX, player.y - player.lastY) > 0.2;
    player.trailT -= dt;
    if (player.trailT <= 0) {
      spawnPart(player.x + (Math.random() - 0.5) * 6, player.y + 4, (Math.random() - 0.5) * 6, 14,
        0.4 + Math.random() * 0.3, [10, 7, 14, 12][Math.floor(Math.random() * 4)]);
      player.trailT = moved ? 0.03 : 0.15;
    }
    player.lastX = player.x; player.lastY = player.y;

    // 攻擊產生
    spawnT -= dt;
    if (spawnT <= 0 && patterns.length < maxConcurrent()) {
      pickPattern();
      spawnT = spawnInterval();
    }
    for (let i = patterns.length - 1; i >= 0; i--) {
      if (patterns[i].update(dt)) patterns.splice(i, 1);
    }

    // 子彈移動與碰撞
    const bdt = player.slow > 0 ? dt * 0.5 : dt;
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.age += bdt;
      if (b.homing) {
        let da = Math.atan2(player.y - b.y, player.x - b.x) - b.a;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        const m = 1.6 * bdt;
        b.a += clamp(da, -m, m);
        b.vx = Math.cos(b.a) * b.spd; b.vy = Math.sin(b.a) * b.spd;
      }
      b.x += b.vx * bdt; b.y += b.vy * bdt;
      let dead = b.x < -24 || b.x > W + 24 || b.y < -24 || b.y > H + 24;
      if (b.age >= b.life) { dead = true; burst(b.x, b.y, 13, 4, 30); }
      if (!dead && state === 'play' && player.inv <= 0 && !god) {
        const dx = b.x - player.x, dy = b.y - player.y, rr = b.r + HIT_R;
        if (dx * dx + dy * dy < rr * rr) { dead = true; hitPlayer(); }
      }
      if (dead) removeBullet(i);
    }

    // 道具
    itemT -= dt;
    if (itemT <= 0) { spawnItem(); itemT = 12 + Math.random() * 6; }
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.age += dt;
      if (state === 'play' && Math.hypot(it.x - player.x, it.y - player.y) < PICK_R) {
        items.splice(i, 1);
        pickup(it.k);
      } else if (it.age >= 6) {
        items.splice(i, 1);
      }
    }

    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].age += dt;
      popups[i].y -= 14 * dt;
      if (popups[i].age > 0.9) popups.splice(i, 1);
    }
    if (banner) { banner.age += dt; if (banner.age > 2.2) banner = null; }
  }

  function update(dt) {
    stateT += dt;
    if (state === 'pause') return;
    for (const s of stars) {
      s.y += s.sp * dt;
      if (s.y > H) { s.y -= H; s.x = Math.random() * W; }
    }
    if (state === 'play') updatePlay(dt);
    if (state === 'title') player.wingT += dt;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) {
        const last = parts.pop();
        if (i < parts.length) parts[i] = last;
        partPool.push(p);
      }
    }
    if (shakeT > 0) shakeT -= dt;
    if (flashT > 0) flashT -= dt;
    if (hurtT > 0) hurtT -= dt;
  }

  // ---------- 繪製 ----------
  const pauseR = { x: 146, y: 0, w: 18, h: 16 };
  const muteR = { x: 164, y: 0, w: 16, h: 16 };
  const retryR = { x: 45, y: 198, w: 90, h: 16 };
  const titleR = { x: 45, y: 220, w: 90, h: 16 };
  const focusing = () => !!(keys.ShiftLeft || keys.ShiftRight);

  function drawStars() {
    for (const s of stars) {
      if (s.c === 7 && Math.sin(stateT * 3 + s.ph) < 0) continue;
      ctx.fillStyle = PAL[s.c];
      ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
    }
  }
  function drawFairy(x, y, scale) {
    const size = 12 * scale;
    ctx.globalAlpha = 0.75;
    ctx.drawImage(Math.floor(player.wingT * 8) % 2 ? WING_B : WING_A, x, y, size, size);
    ctx.globalAlpha = 1;
    ctx.drawImage(FAIRY, x, y, size, size);
  }
  function drawPlayer() {
    const x = Math.round(player.x), y = Math.round(player.y);
    const blink = player.inv > 0 && Math.floor(player.inv * 16) % 2 === 1;
    if (!blink) drawFairy(x - 6, y - 6, 1);
    if (player.shield > 0 && !(player.shield < 2 && Math.floor(player.shield * 8) % 2)) {
      ctx.globalAlpha = 0.8;
      ctx.drawImage(SHIELD_RING, x - 9, y - 9);
      ctx.globalAlpha = 1;
    }
  }
  function drawHitbox() {
    const x = Math.round(player.x), y = Math.round(player.y);
    if (focusing()) {
      ctx.globalAlpha = 0.7;
      ctx.drawImage(FOCUS_RING, x - 5, y - 5);
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = PAL[7];
    ctx.fillRect(x - 1, y, 3, 1);
    ctx.fillRect(x, y - 1, 1, 3);
    ctx.fillStyle = PAL[8];
    ctx.fillRect(x, y, 1, 1);
  }
  function drawBullets() {
    for (const b of bullets) {
      if (b.homing && b.life - b.age < 0.8 && Math.floor(b.age * 12) % 2) continue;
      const spr = b.bt.spr, d = spr.width;
      ctx.drawImage(spr, Math.round(b.x - d / 2), Math.round(b.y - d / 2));
    }
  }
  function drawItems() {
    for (const it of items) {
      if (6 - it.age < 2 && Math.floor(it.age * 8) % 2) continue;
      const x = Math.round(it.x), y = Math.round(it.y + Math.sin(it.age * 4) * 1.5);
      ctx.globalAlpha = 0.45 + 0.35 * Math.sin(it.age * 6);
      ctx.drawImage(ITEM_RING, x - 6, y - 6);
      ctx.globalAlpha = 1;
      ctx.drawImage(ITEM_SPR[it.k], x - 4, y - 4);
    }
  }
  function drawParts() {
    for (const p of parts) {
      if (p.life < p.max * 0.3 && Math.floor(p.life * 30) % 2) continue;
      ctx.fillStyle = PAL[p.c];
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
    }
  }
  function drawIconButtons() {
    if (state === 'play' || state === 'pause') ctx.drawImage(state === 'pause' ? ICON_PLAY : ICON_PAUSE, 155, 4);
    ctx.drawImage(muted ? ICON_MUTE : ICON_SOUND, 168, 4);
  }
  function drawBar(x, y, ratio, color) {
    ctx.fillStyle = PAL[5];
    ctx.fillRect(x, y, 20, 3);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, Math.ceil(20 * ratio), 3);
  }
  function drawHUD() {
    for (let i = 0; i < 3; i++) ctx.drawImage(i < player.lives ? HEART : HEART_EMPTY, 3 + i * 9, 3);
    drawTextC(state === 'over' ? finalScore : score(), W / 2, 3, PAL[7]);
    drawTextC('HI ' + hi, W / 2, 10, PAL[6]);
    let ey = 12;
    if (player.shield > 0) { drawText('SHIELD', 3, ey, PAL[12]); drawBar(29, ey + 1, player.shield / 10, PAL[12]); ey += 7; }
    if (player.slow > 0) { drawText('SLOW', 3, ey, PAL[12]); drawBar(29, ey + 1, player.slow / 5, PAL[12]); }
    drawIconButtons();
  }
  function drawButton(r, label) {
    ctx.fillStyle = PAL[1];
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = PAL[7];
    ctx.fillRect(r.x, r.y, r.w, 1);
    ctx.fillRect(r.x, r.y + r.h - 1, r.w, 1);
    ctx.fillRect(r.x, r.y, 1, r.h);
    ctx.fillRect(r.x + r.w - 1, r.y, 1, r.h);
    drawTextC(label, r.x + r.w / 2, r.y + 6, PAL[7]);
  }
  function drawTitle() {
    drawTextC('PIXIE', W / 2, 46, PAL[14], 3);
    drawTextC('DODGE', W / 2, 66, PAL[12], 3);
    drawFairy(W / 2 - 18, 104, 3);
    const kinds = ['aimed', 'fan', 'ring', 'spiral', 'homing', 'wall'];
    for (let i = 0; i < 12; i++) {
      const a = stateT * 0.8 + i * Math.PI / 6, spr = BT[kinds[i % 6]].spr, d = spr.width;
      ctx.drawImage(spr, Math.round(W / 2 + Math.cos(a) * 34 - d / 2), Math.round(122 + Math.sin(a) * 34 - d / 2));
    }
    drawTextC('HI ' + hi, W / 2, 166, PAL[10]);
    if (Math.floor(stateT * 2) % 2 === 0) drawTextC('TAP OR PRESS ANY KEY', W / 2, 182, PAL[7]);
    drawTextC('DRAG / ARROWS / WASD : MOVE', W / 2, 206, PAL[6]);
    drawTextC('HOLD SHIFT : SLOW MOVE', W / 2, 215, PAL[6]);
    drawTextC('P / ESC : PAUSE   M : SOUND', W / 2, 224, PAL[6]);
    drawTextC('ITEMS', W / 2, 246, PAL[13]);
    const names = { shield: 'SHIELD', bomb: 'BOMB', slow: 'SLOW', heal: 'HEAL' };
    ITEM_TYPES.forEach((k, i) => {
      const cx = 22 + i * 45;
      ctx.drawImage(ITEM_SPR[k], cx - 4, 258);
      drawTextC(names[k], cx, 272, PAL[6]);
    });
    drawIconButtons();
  }
  function drawBanner() {
    if (!banner || (banner.age < 0.6 && Math.floor(banner.age * 10) % 2)) return;
    drawTextC(banner.title, W / 2, 110, banner.c, 2);
    if (banner.sub) drawTextC(banner.sub, W / 2, 126, PAL[7]);
  }
  function drawOver() {
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = PAL[0];
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    drawTextC('GAME OVER', W / 2, 92, PAL[8], 2);
    drawTextC('SCORE', W / 2, 120, PAL[6]);
    drawTextC(finalScore, W / 2, 128, PAL[7], 2);
    drawTextC('TIME ' + elapsed.toFixed(1) + 'S', W / 2, 148, PAL[6]);
    drawTextC('BEST ' + hi, W / 2, 157, PAL[10]);
    if (newRecord && Math.floor(stateT * 4) % 2 === 0) drawTextC('NEW RECORD!', W / 2, 174, PAL[10], 1);
    if (stateT >= 0.8) {
      drawButton(retryR, 'RETRY');
      drawButton(titleR, 'TITLE');
      drawTextC('ENTER: RETRY   ESC: TITLE', W / 2, 246, PAL[13]);
    }
  }
  function drawPause() {
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = PAL[0];
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    drawTextC('PAUSED', W / 2, 140, PAL[7], 2);
    if (Math.floor(stateT * 2) % 2 === 0) drawTextC('TAP OR PRESS P TO RESUME', W / 2, 162, PAL[6]);
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = PAL[0];
    ctx.fillRect(0, 0, W, H);
    if (shakeT > 0 && state === 'play') {
      ctx.setTransform(1, 0, 0, 1, Math.round((Math.random() * 2 - 1) * 2), Math.round((Math.random() * 2 - 1) * 2));
    }
    ctx.fillStyle = PAL[1];
    ctx.fillRect(-4, -4, W + 8, H + 8);
    drawStars();

    if (state === 'title') {
      drawParts();
      drawTitle();
    } else {
      drawItems();
      if (state !== 'over') for (const p of patterns) if (p.draw) p.draw();
      drawParts();
      if (state !== 'over') drawPlayer();
      drawBullets();
      if (state !== 'over') drawHitbox();
      for (const p of popups) drawTextC(p.text, p.x, Math.round(p.y), p.c);
      drawBanner();

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (player.slow > 0 && !(player.slow < 1.5 && Math.floor(player.slow * 8) % 2)) {
        ctx.globalAlpha = 0.08;
        ctx.fillStyle = PAL[12];
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
        ctx.fillStyle = PAL[12];
        ctx.fillRect(0, 0, W, 1); ctx.fillRect(0, H - 1, W, 1);
        ctx.fillRect(0, 0, 1, H); ctx.fillRect(W - 1, 0, 1, H);
      }
      if (hurtT > 0) {
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = PAL[8];
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
      }
      drawHUD();
      if (state === 'pause') drawPause();
      if (state === 'over') drawOver();
    }

    if (flashT > 0) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = Math.min(1, flashT / 0.25) * 0.7;
      ctx.fillStyle = PAL[7];
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- 輸入 ----------
  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  const inRect = (p, r) => p.x >= r.x && p.x < r.x + r.w && p.y >= r.y && p.y < r.y + r.h;

  function beginDrag(e, p) {
    drag = { id: e.pointerId, ox: player.x - p.x, oy: player.y - p.y };
    document.body.classList.add('dragging');
  }
  function endDrag(e) {
    if (drag && e.pointerId === drag.id) {
      drag = null;
      document.body.classList.remove('dragging');
    }
  }

  window.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    ensureAudio();
    const p = toLogical(e);
    if (inRect(p, muteR)) { toggleMute(); return; }
    if (state === 'title') {
      startGame();
      beginDrag(e, p);
    } else if (state === 'play') {
      if (inRect(p, pauseR)) { pauseGame(); return; }
      beginDrag(e, p);
    } else if (state === 'pause') {
      resumeGame();
    } else if (state === 'over' && stateT >= 0.8) {
      if (inRect(p, retryR)) startGame();
      else if (inRect(p, titleR)) toTitle();
    }
  }, { passive: false });

  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (e.pointerType === 'mouse' && e.buttons === 0) { endDrag(e); return; }
    if (state !== 'play') return;
    const p = toLogical(e);
    player.x = clamp(p.x + drag.ox, 4, W - 4);
    player.y = clamp(p.y + drag.oy, 4, H - 4);
  });
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  const NO_START = new Set(['ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight', 'AltLeft', 'AltRight',
                            'MetaLeft', 'MetaRight', 'Tab', 'KeyM', 'CapsLock']);
  window.addEventListener('keydown', e => {
    const c = e.code;
    if (c.startsWith('Arrow') || c === 'Space') e.preventDefault();
    keys[c] = true;
    if (e.repeat) return;
    ensureAudio();
    if (c === 'KeyM') { toggleMute(); return; }
    if (state === 'title') {
      if (!NO_START.has(c)) startGame();
    } else if (state === 'play') {
      if (c === 'KeyP' || c === 'Escape') pauseGame();
    } else if (state === 'pause') {
      if (c === 'KeyP' || c === 'Escape' || c === 'Enter' || c === 'Space') resumeGame();
    } else if (state === 'over' && stateT >= 0.8) {
      if (c === 'Enter' || c === 'Space' || c === 'KeyR') startGame();
      else if (c === 'Escape') toTitle();
    }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { pauseGame(); releaseInput(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- 縮放（整數倍）----------
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.floor(Math.min(vw * dpr / W, vh * dpr / H));
    const css = s >= 1 ? s / dpr : Math.min(vw / W, vh / H);
    canvas.style.width = W * css + 'px';
    canvas.style.height = H * css + 'px';
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  // ---------- 主迴圈 ----------
  let last = performance.now();
  function frame(now) {
    const raw = (now - last) / 1000;
    last = now;
    if (raw > 0) fps = fps * 0.95 + (1 / raw) * 0.05;
    update(Math.min(0.05, Math.max(0, raw)));
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 測試用：網址加上 #debug 才會開啟，且不會寫入最高分
  if (DEBUG) {
    window.__pixie = {
      start: startGame,
      setTime(v) { elapsed = v; },
      god(on) { god = !!on; },
      item(k, x, y) { spawnItem(k, x, y); },
      pattern(k) { addPattern(k); },
      info() {
        return {
          state, elapsed: +elapsed.toFixed(2), level, lives: player.lives, bullets: bullets.length,
          patterns: patterns.map(p => p.kind), items: items.map(i => i.k), score: score(), hi,
          shield: +player.shield.toFixed(2), slow: +player.slow.toFixed(2),
          x: +player.x.toFixed(1), y: +player.y.toFixed(1), muted, fps: Math.round(fps),
        };
      },
    };
  }
})();
</script>
</body>
</html>
